<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Data | Excel Export</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: #111c30;
            border: 1px solid #26354b;
            border-radius: 20px;
            padding: 55px 35px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .tag {
            display: inline-block;
            padding: 8px 13px;
            border: 1px solid #285b46;
            border-radius: 30px;
            color: #6ee7a8;
            background: #142d27;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }

        h1 {
            color: #f8fafc;
            font-size: clamp(30px, 5vw, 42px);
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        h1 span {
            color: #4ade80;
        }

        p {
            max-width: 420px;
            margin: 0 auto 32px;
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.8;
        }

        button {
            padding: 15px 26px;
            background: #22c55e;
            color: #052e16;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s ease;
        }

        button:hover {
            background: #4ade80;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.18);
        }

        button:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #26354b;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="tag">STUDENT MANAGEMENT</div>

        <h1>Student Data <span>Exporter</span></h1>

        <p>
            Filter student records, organize your data, and export
            the results into a neatly formatted Excel spreadsheet.
        </p>

        <button>Filter User</button>

        <div class="footer">
            ES6 PRACTICE &nbsp; • &nbsp; EXCEL EXPORT
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
```
